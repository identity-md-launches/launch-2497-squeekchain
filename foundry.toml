[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# The launch compares deployed bytes without the metadata hash.
bytecode_hash = "none"

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
